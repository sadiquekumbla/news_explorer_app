<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Explorer App API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .endpoint {
      background-color: #f4f4f4;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    code {
      background-color: #e0e0e0;
      padding: 2px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>News Explorer App API</h1>
  <p>This is the API endpoint for the News Explorer App. The following endpoints are available:</p>
  
  <div class="endpoint">
    <h2>Categories</h2>
    <p>Get all available news categories:</p>
    <code>GET /api/categories.json</code>
  </div>
  
  <div class="endpoint">
    <h2>News</h2>
    <p>Get news articles:</p>
    <code>GET /api/news.json</code>
  </div>
</body>
</html>
